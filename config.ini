; ============================================================
;  Configuración del Exportador Tableau Server / Tableau Cloud
; ============================================================

[tableau]
; URL del servidor. Ej: https://tableau.empresa.cl  o  https://10ax.online.tableau.com
server_url = https://tableau.empresa.cl

; Sitios a exportar, separados por coma (se usa el "contentUrl" que aparece en la URL: #/site/<sitio>/...)
;   vacío  -> sitio por defecto (Default) de Tableau Server
;   *      -> todos los sitios (solo Tableau Server y con un token de administrador de servidor)
sites =

; Personal Access Token (PAT). Si se dejan vacíos, el programa los pide al ejecutar
; (recomendado en reuniones con clientes para no guardar el token en el archivo).
; También se pueden definir con las variables de entorno TABLEAU_TOKEN_NAME y TABLEAU_TOKEN_VALUE.
token_name =
token_value =

; Poner en false solo si el servidor usa un certificado SSL interno/autofirmado
verify_ssl = true

[exportacion]
; Carpeta donde se guarda todo (archivos, inventario y logs)
carpeta_salida = ./exportacion

; Qué descargar
descargar_workbooks = true
descargar_fuentes = true
descargar_flujos = true

; true = descarga .twbx/.tdsx con los extractos (.hyper) incluidos (más pesado)
incluir_extractos = true

; true = vuelve a descargar archivos que ya existen en la carpeta.
; false = los salta (permite re-ejecutar y bajar solo lo que faltó).
sobrescribir = false

; Inventario de campos por hoja (como el de Copec). Usa la Metadata API.
inventario_campos = true

; Limitar a ciertos proyectos de primer nivel (separados por coma). Vacío = todos.
filtro_proyectos =
